[project]
name = "resume-ranker"
version = "2.0.0a1"
description = "Resume Ranker V2 — Hybrid extraction, deterministic ATS, explainable scoring"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.20",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    # Serverless
    "mangum>=0.17.0",
    "redis>=5.0.0",
    # AWS
    "boto3>=1.43.36",
    # PDF parsing (replaces pymupdf — fitz is banned in V2)
    "opendataloader-pdf>=2.0.0",
    "pymupdf>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PL"]
ignore = ["PLR0913"]  # allow many arguments in dataclass constructors

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

# Legacy V1 ranking modules — not annotated, no changes allowed per rules.md
[[tool.mypy.overrides]]
module = [
    "src.ranking.*",
    "src.schemas.*",
    "src.api.*",
    "src.extractors.*",
    "src.infrastructure.*",
]
ignore_errors = true

# Modules with pre-existing type: ignore for missing stubs (boto3, opendataloader)
[[tool.mypy.overrides]]
module = [
    "src.extraction.odl_cache",
    "src.extraction.structural_parsing_service",
    "src.extraction.fallback.nova_service",
]
warn_unused_ignores = false

[tool.pytest.ini_options]
markers = [
    "regression: marks tests as regression tests (deselect with '-m \"not regression\"')",
    "golden: marks tests as golden-file snapshot tests",
]
